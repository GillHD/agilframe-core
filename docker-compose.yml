# AgilFrame — production compose (behind an existing reverse proxy).
#
# The app binds to 127.0.0.1 only; TLS terminates at your proxy
# (Caddy/Nginx/HAProxy). coturn runs on the host network for WebRTC TURN.
#
#   cp .env.example .env   # заполните секреты
#   docker compose up -d --build

name: agil-calls

services:
  agil-calls:
    build: .
    image: agil-calls:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGIL_HOST_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      AGIL_DATA_DIR: /app/.data
      AGIL_PUBLIC_ORIGIN: ${AGIL_PUBLIC_ORIGIN}
      AGIL_TRUST_PROXY: "1"
      AGIL_ALLOW_ANONYMOUS: ${AGIL_ALLOW_ANONYMOUS:-0}
      AGIL_ICE_SERVERS: ${AGIL_ICE_SERVERS}
      NODE_ENV: production
    volumes:
      - agil-data:/app/.data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # WebRTC TURN (UDP). UDP 3478 + relay range 49200-49250 must be open.
  # If a TURN server already exists in your infra, remove this service and
  # point AGIL_ICE_SERVERS to your own TURN.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--realm=${TURN_REALM:-agil.local}"
      - "--user=${TURN_USER:-agil}:${TURN_PASSWORD:-CHANGE_ME}"
      - "--listening-port=${TURN_PORT:-3478}"
      - "--min-port=${TURN_MIN_PORT:-49200}"
      - "--max-port=${TURN_MAX_PORT:-49250}"
      - "--relay-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
    volumes:
      - coturn-logs:/var/log

volumes:
  agil-data:
  coturn-logs:
