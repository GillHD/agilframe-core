# CI: Android SDK (JDK 17 / Gradle 8.9 / AGP 8.7.3).
#
# Runs only JVM unit tests and build/lint tasks. There is no emulator, no
# `connectedAndroidTest`, and no device farm: this repository's Android module
# is a WebView library and its tests are pure JVM.
#
# The repository intentionally has no Gradle wrapper; the workflow installs
# Gradle 8.9 explicitly. No deployment/publishing to Maven happens here.
name: CI / Android

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  GRADLE_VERSION: '8.9'
  JAVA_VERSION: '17'

jobs:
  android:
    name: Android (JDK 17 / Gradle 8.9)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agil/mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show toolchain
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Compile, test, lint and assemble (no device)
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :agil-calls:compileDebugKotlin \
            :agil-calls:testDebugUnitTest \
            :agil-calls:lintRelease \
            :agil-calls:assembleRelease \
            :agil-calls-compose:compileDebugKotlin \
            :agil-calls-compose:lintRelease \
            :agil-calls-compose:assembleRelease \
            :example:assembleDebug

      - name: Upload Android artifacts and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results-${{ github.sha }}
          path: |
            agil/mobile/android/**/build/outputs/aar/*.aar
            agil/mobile/android/**/build/reports/tests/**
            agil/mobile/android/**/build/reports/lint-results-*
            agil/mobile/android/example/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
