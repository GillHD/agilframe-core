# AgilFrame — nginx sample vhost.
#
# This is a TEMPLATE. It is not installed or reloaded by any script in this
# repository. Copy it into your nginx config, replace the hostname and
# certificate paths, then `nginx -t && systemctl reload nginx`.
#
# Assumes core listens on 127.0.0.1:8787 (quickstart default) and nginx
# terminates TLS. WebSocket upgrades on /ws need HTTP/1.1 + long timeouts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agil_core {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name calls.example.com;

    # ACME HTTP-01 (certbot webroot). Keep if you use certbot --webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1+. On older nginx use: listen 443 ssl http2;
    http2 on;
    server_name calls.example.com;

    ssl_certificate     /etc/letsencrypt/live/calls.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calls.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:AGIL:10m;
    ssl_session_timeout 1d;

    # Uploads/recordings: keep >= AGIL_MAX_UPLOAD_MB (25 by default).
    client_max_body_size 30m;
    client_body_timeout  60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/agil-access.log;
    error_log  /var/log/nginx/agil-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Widget can carry the join token in a WebSocket subprotocol.
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # A 60s default kills idle WebSockets and reconnects calls.
    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    proxy_buffering       off;

    location /ws {
        proxy_pass http://agil_core;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass http://agil_core;
    }

    # Optional: keep API docs off the public internet.
    # location /docs {
    #     allow 10.0.0.0/8;
    #     deny  all;
    #     proxy_pass http://agil_core;
    # }

    # Optional: static assets can be cached aggressively (hashed filenames).
    # location ~* ^/(dashboard|editor|sdk|widget)/assets/ {
    #     proxy_pass http://agil_core;
    #     proxy_cache_valid 200 7d;
    #     add_header Cache-Control "public, max-age=604800, immutable";
    # }
}
