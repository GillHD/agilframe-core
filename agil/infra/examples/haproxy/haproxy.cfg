# AgilFrame — HAProxy sample (TLS termination + WebSocket).
#
# TEMPLATE only: copy into your HAProxy config, replace the certificate, and
# validate with `haproxy -c -f /etc/haproxy/haproxy.cfg` before reloading.
#
# This example terminates TLS for calls.example.com and proxies to core on
# 127.0.0.1:8787. HAProxy in HTTP mode handles WebSocket upgrades automatically;
# the important bits are the 1h tunnel/client/server timeouts and forwarding
# headers.
#
# The optional SFU section shows SNI/host routing to a LiveKit node without
# making it a hard dependency — delete it if you do not run an SFU.

global
    log         /dev/log local0
    maxconn     20000
    nbthread    2
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    retries 3
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s
    timeout tunnel  3600s
    timeout http-request 30s
    timeout http-keep-alive 30s
    errorfile 503 /etc/haproxy/errors/503.http

frontend fe_http
    bind *:80
    mode http
    # ACME HTTP-01 is usually served by the proxy itself; if certbot runs on
    # this host, add: http-request return status 200 content-type text/plain lf-string "%[path]" if { path_beg /.well-known/acme-challenge/ }
    http-request redirect scheme https code 301 unless { path_beg /.well-known/acme-challenge/ }
    default_backend be_core

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/calls.example.com.pem alpn h2,http/1.1
    mode http

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    acl host_core hdr(host) -i calls.example.com
    # acl host_sfu  hdr(host) -i sfu.example.com

    use_backend be_core if host_core
    # use_backend be_sfu if host_sfu
    default_backend be_core

backend be_core
    mode http
    balance roundrobin
    # /v1/health is a process probe. Only /v1/ready excludes standby Core
    # and a newly promoted Core that has not yet finished restoration.
    option httpchk GET /v1/ready
    http-check expect status 200
    http-reuse safe
    # Do not let a slow upload kill the connection: body is buffered by HAProxy.
    server core1 127.0.0.1:8787 check inter 2s fall 1 rise 1
    # For Redis HA use distinct Core addresses and distinct local data dirs.
    # server core2 127.0.0.1:8788 check inter 2s fall 1 rise 1

    # Match AGIL_MAX_UPLOAD_MB (25) with headroom.
    # (HAProxy has no per-backend body limit; enforce it at the WAF or nginx.)

# --- optional: LiveKit SFU on the same HAProxy -----------------------------
# backend be_sfu
#     mode http
#     balance roundrobin
#     option httpchk GET /
#     http-check expect status 200
#     timeout tunnel 3600s
#     server sfu1 127.0.0.1:7880 check inter 5s fall 3 rise 2
