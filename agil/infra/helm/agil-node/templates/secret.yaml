{{- if and (not .Values.enrollment.existingSecret) (or .Values.enrollment.token .Values.enrollment.nodeKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agil-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agil-node.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.enrollment.token }}
  {{ $.Values.enrollment.tokenKey }}: {{ . | trim | b64enc | quote }}
  {{- end }}
  {{- with .Values.enrollment.nodeKey }}
  {{ $.Values.enrollment.nodeKeyKey }}: {{ . | trim | b64enc | quote }}
  {{- end }}
{{- end }}
