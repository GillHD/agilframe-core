{{- if not .Values.secrets.existingSecret }}
{{- /*
  Generated secret. Values from `secrets.*` win; otherwise existing values are
  preserved across `helm upgrade` via lookup, and missing ones are generated.
  Never put real secrets in values.yaml.
*/}}
{{- $fullname := include "agil-core.fullname" . -}}
{{- $existing := dict -}}
{{- if .Release.IsInstall -}}
{{- $existing = dict -}}
{{- else -}}
{{- $existing = (lookup "v1" "Secret" .Release.Namespace $fullname).data | default dict -}}
{{- end -}}
{{- $tokenSecret := .Values.secrets.tokenSecret -}}
{{- if not $tokenSecret -}}{{- $tokenSecret = get $existing "AGIL_TOKEN_SECRET" | default "" | b64dec -}}{{- end -}}
{{- if not $tokenSecret -}}{{- $tokenSecret = randAlphaNum 64 -}}{{- end -}}
{{- $ipSalt := .Values.secrets.ipSalt -}}
{{- if not $ipSalt -}}{{- $ipSalt = get $existing "AGIL_IP_SALT" | default "" | b64dec -}}{{- end -}}
{{- if not $ipSalt -}}{{- $ipSalt = randAlphaNum 32 -}}{{- end -}}
{{- $apiKeys := .Values.secrets.apiKeys -}}
{{- if not $apiKeys -}}{{- $apiKeys = get $existing "AGIL_API_KEYS" | default "" | b64dec -}}{{- end -}}
{{- if not $apiKeys -}}{{- $apiKeys = printf "agil_%s:%s" (randAlphaNum 24 | lower) (default "demo" .Values.defaultTenant) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agil-core.labels" . | nindent 4 }}
type: Opaque
data:
  AGIL_TOKEN_SECRET: {{ $tokenSecret | b64enc | quote }}
  AGIL_IP_SALT: {{ $ipSalt | b64enc | quote }}
  AGIL_API_KEYS: {{ $apiKeys | b64enc | quote }}
  {{- with .Values.secrets.platformKey }}
  AGIL_PLATFORM_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.scimToken }}
  AGIL_SCIM_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.e2eeSecret }}
  AGIL_E2EE_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.mcpHttpToken }}
  AGIL_MCP_HTTP_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.deepseekApiKey }}
  AGIL_DEEPSEEK_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.aiAgentHmacSecret }}
  AGIL_AI_AGENT_HMAC_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.integrityKey }}
  AGIL_INTEGRITY_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sttKey }}
  AGIL_STT_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sfuApiKey }}
  AGIL_SFU_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sfuApiSecret }}
  AGIL_SFU_API_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.egressApiKey }}
  AGIL_EGRESS_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.egressApiSecret }}
  AGIL_EGRESS_API_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sipApiKey }}
  AGIL_SIP_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.sipApiSecret }}
  AGIL_SIP_API_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  AGIL_OIDC_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.injectEnv .Values.redis.url }}
  AGIL_REDIS_URL: {{ .Values.redis.url | b64enc | quote }}
  {{- end }}
  {{- if and .Values.postgres.enabled .Values.postgres.injectEnv .Values.postgres.url }}
  AGIL_DATABASE_URL: {{ .Values.postgres.url | b64enc | quote }}
  {{- end }}
{{- end }}
