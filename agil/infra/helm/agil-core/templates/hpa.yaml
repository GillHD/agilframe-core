{{- if .Values.autoscaling.enabled }}
{{- /*
  WARNING: AGIL Core 0.1.0 keeps rooms/WebSockets in memory. Horizontal scaling
  is not supported: extra replicas would split rooms and break signalling.
  This template exists for forward compatibility only.
*/}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agil-core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agil-core.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agil-core.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
