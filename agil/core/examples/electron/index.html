<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgilFrame × Electron</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; background: #0b0f17; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
      #call { height: 100vh; width: 100vw; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #status[hidden] { display: none; }
      code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="call"></div>
    <div id="status"><div>
      <h3>AgilFrame × Electron</h3>
      <p id="message">Готовим комнату…</p>
      <p style="opacity:.7;font-size:13px">Сервер: <code id="server"></code></p>
    </div></div>
    <script src="./bootstrap.js"></script>
  </body>
</html>
