logLevel: warn
api: true
apiAddress: :9997
rtsp: false
rtspTransports: [tcp]
rtmp: true
rtmpEncryption: strict
rtmpsAddress: :1936
rtmpServerCert: /certs/fullchain.pem
rtmpServerKey: /certs/privkey.pem
hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentCount: 4
hlsSegmentDuration: 2s
playback: true
playbackAddress: :9996
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: false
srt: false
moq: false
authMethod: http
authHTTPExclude:
  - action: api
  - action: playback
pathDefaults:
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordSegmentDuration: 30s
  recordDeleteAfter: 24h
paths:
  '~^obs/[A-Za-z0-9_-]{22}$':
    source: publisher
    overridePublisher: false
