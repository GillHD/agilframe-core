# LiveKit SFU configuration for the local egress lab.
#
# Used only by docker-compose.lab.yml. API keys are NOT stored here: the
# container gets LIVEKIT_KEYS from the environment (same key/secret the app and
# egress use). Do not reuse this file in production: production lives in
# agil/core/deploy/livekit/livekit.yaml with external IP/TURN settings.
#
# Redis is the compose service DNS name; egress (host networking) reaches the
# published loopback port instead (127.0.0.1:6380). Both point at the same
# Redis instance — the hard requirement for job dispatch.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Local lab: no public IP/STUN. Browsers on the same host use 127.0.0.1.
  use_external_ip: false

redis:
  address: redis:6379

logging:
  level: info

room:
  empty_timeout: 300
  departure_timeout: 20
