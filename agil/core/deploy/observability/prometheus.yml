# AgilFrame — Prometheus scrape configuration (optional, not deployed by the repo).
#
# Replace every *.internal hostname and calls.example.com with your real values
# before use. Nothing here contains a secret; do not add credentials to a file
# that may be committed.
#
# What is scraped and why:
#   - agil-app-health / agil-egress-health : blackbox probes (the app has no
#     /metrics endpoint — do NOT add a direct app scrape, it would 404).
#   - agil-sfu-1/2  : LiveKit Prometheus endpoint (livekit.yaml prometheus.port
#                     6789, livekit-node2.yaml 6790).
#   - agil-sfu-egress: LiveKit egress worker metrics (egress.yaml
#                     prometheus_port: 9090).
#   - agil-sfu-tcp  : blackbox TCP connect to the LiveKit signalling port.
#   - node          : host CPU/RAM/disk/network (node_exporter :9100).
#   - cadvisor      : optional per-container CPU/RAM/restarts (:8081 here to
#                     avoid the egress health port 8080).
#   - redis         : optional redis_exporter (:9121); the app itself has no
#                     Redis dependency, this is the SFU/egress bus.
#
# Metrics ports must stay private: LiveKit :6789/:6790, egress :9090/:8080 and
# this Prometheus all expose unauthenticated data and name internal hosts.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    env: production
    stack: agil-calls

rule_files:
  - /etc/prometheus/rules/agil-alerts.yml

# Enable once an Alertmanager exists; rules also show up as inactive alerts.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
        # - targets: ["alertmanager.internal:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # --- synthetic probes -----------------------------------------------------
  - job_name: agil-app-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://calls.example.com/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: agil-egress-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://egress.internal:8080/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: agil-sfu-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - sfu-1.internal:7880
          - sfu-2.internal:7890
        labels:
          protocol: signaling
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- LiveKit SFU nodes ----------------------------------------------------
  - job_name: agil-sfu-1
    metrics_path: /metrics
    static_configs:
      - targets: ["sfu-1.internal:6789"]
        labels:
          node: sfu-1
          region: ru-msk

  - job_name: agil-sfu-2
    metrics_path: /metrics
    static_configs:
      - targets: ["sfu-2.internal:6790"]
        labels:
          node: sfu-2
          region: ru-msk

  # --- LiveKit egress worker ------------------------------------------------
  - job_name: agil-sfu-egress
    metrics_path: /metrics
    static_configs:
      - targets: ["egress.internal:9090"]
        labels:
          node: egress-1

  # --- hosts ----------------------------------------------------------------
  # Add all-in-one agents over a private network. The agent also serves
  # authenticated local controls on this port, so keep it off public routes.
  # - job_name: agil-node-agent
  #   static_configs:
  #     - targets: ["sfu-1.internal:8080", "sfu-2.internal:8080"]

  - job_name: node
    static_configs:
      - targets: ["server3.internal:9100"]
        labels:
          host: app-1
      - targets: ["sfu-1.internal:9100"]
        labels:
          host: sfu-1
      - targets: ["sfu-2.internal:9100"]
        labels:
          host: sfu-2
      - targets: ["egress.internal:9100"]
        labels:
          host: egress-1

  # --- optional: per-container resources ------------------------------------
  # Enable together with the `cadvisor` profile in docker-compose.yml.
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]

  # --- optional: Redis (SFU/egress bus) -------------------------------------
  # The app has no Redis dependency; this monitors LiveKit's Redis.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
