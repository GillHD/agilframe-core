; AgilFrame — local SIP lab module selection.
;
; `autoload=yes` keeps the image's default module set (PJSIP, MixMonitor,
; Read, Playback, System, ...). The noload lines only disable legacy channel
; drivers that would otherwise grab ports/CPU on this single-host lab:
;
;   chan_sip    deprecated in Asterisk 20, binds 5060/udp like PJSIP and its
;               SIP registrations are not used anywhere in this lab.
;   chan_skinny legacy SCCP, binds 2000/tcp.
;   chan_mgcp   legacy MGCP, binds 2727/udp.
;
; If you extend the lab, add modules here instead of mounting a different
; modules.conf from a newer Asterisk release (module names change).

[modules]
autoload=yes
noload => chan_sip.so
noload => chan_skinny.so
noload => chan_mgcp.so
