; AgilFrame — local SIP lab dialplan (Asterisk 20).
;
; Every extension is a "test fixture" with a distinct, greppable marker:
;
;   +15550100  RTP leg A: answers, records rx/tx, plays demo-congrats.
;   +15550102  RTP leg B: answers, records rx/tx, plays hello-world.
;              A and B are dialled into the SAME LiveKit room by the app, so
;              A's rx file can only contain B's audio (and vice versa): both
;              files prove bidirectional RTP through the SFU.
;   +15550101  DTMF leg: answers, collects digits via Read (RFC 2833/RTP or SIP
;              INFO from LiveKit's CreateSIPParticipant.dtmf), appends them to
;              recordings/dtmf.log, then beeps and hangs up.
;
; Recordings land in /var/spool/asterisk/monitor (bind mount ./recordings).
; `r(file)`/`t(file)` are MixMonitor's separate read/write streams: rx is what
; Asterisk received over RTP, tx is what it sent.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-livekit]

; Audio leg A: 440 Hz tone. Long enough to overlap leg B's 880 Hz tone, so both
; directions are recorded simultaneously. The prompts are generated by
; scripts/gen-tones.mjs (the image ships no sound files) and mounted at
; /var/lib/asterisk/sounds/en.
exten => _+15550100,1,NoOp(AGIL lab: RTP leg A for ${EXTEN})
 same => n,Answer()
 same => n,Set(REC=/var/spool/asterisk/monitor)
 same => n,MixMonitor(${REC}/a-mix-${UNIQUEID}.wav,r(${REC}/a-rx-${UNIQUEID}.wav)t(${REC}/a-tx-${UNIQUEID}.wav))
 same => n,Verbose(1, AGIL_LAB_RTP_A_UP uniqueid=${UNIQUEID})
 same => n,Wait(2)
 same => n,Playback(agil-tone-a)
 same => n,Wait(6)
 same => n,Verbose(1, AGIL_LAB_RTP_A_DONE uniqueid=${UNIQUEID})
 same => n,Hangup()

; Audio leg B: 880 Hz tone.
exten => _+15550102,1,NoOp(AGIL lab: RTP leg B for ${EXTEN})
 same => n,Answer()
 same => n,Set(REC=/var/spool/asterisk/monitor)
 same => n,MixMonitor(${REC}/b-mix-${UNIQUEID}.wav,r(${REC}/b-rx-${UNIQUEID}.wav)t(${REC}/b-tx-${UNIQUEID}.wav))
 same => n,Verbose(1, AGIL_LAB_RTP_B_UP uniqueid=${UNIQUEID})
 same => n,Wait(1)
 same => n,Playback(agil-tone-b)
 same => n,Wait(5)
 same => n,Verbose(1, AGIL_LAB_RTP_B_DONE uniqueid=${UNIQUEID})
 same => n,Hangup()

; DTMF leg: 8 digits max, '#' terminates early (Read keeps the terminator).
exten => _+15550101,1,NoOp(AGIL lab: DTMF leg for ${EXTEN})
 same => n,Answer()
 same => n,Set(REC=/var/spool/asterisk/monitor)
 same => n,MixMonitor(${REC}/dtmf-${UNIQUEID}.wav)
 same => n,Verbose(1, AGIL_LAB_DTMF_UP uniqueid=${UNIQUEID})
 same => n,Read(DTMF_DIGITS,,8,,1,12)
 same => n,Verbose(1, AGIL_LAB_DTMF digits=${DTMF_DIGITS} status=${READSTATUS})
 same => n,System(echo "UNIQUEID=${UNIQUEID} DTMF=${DTMF_DIGITS} STATUS=${READSTATUS}" >> ${REC}/dtmf.log)
 same => n,Playback(agil-tone-beep)
 same => n,Wait(1)
 same => n,Hangup()

; Unknown callee: keep the call up briefly so a wrong number is visible in
; recordings/logs instead of a silent 404.
exten => _+X.,1,NoOp(AGIL lab: unknown callee ${EXTEN})
 same => n,Answer()
 same => n,Verbose(1, AGIL_LAB_UNKNOWN_CALLEE ${EXTEN})
 same => n,Wait(2)
 same => n,Hangup()

; Same for a number without the leading '+': LiveKit always sends E.164, but a
; manual `pjsip send` test may not.
exten => _X.,1,NoOp(AGIL lab: non-E.164 callee ${EXTEN})
 same => n,Answer()
 same => n,Verbose(1, AGIL_LAB_UNKNOWN_CALLEE ${EXTEN})
 same => n,Wait(2)
 same => n,Hangup()

exten => i,1,Verbose(1, AGIL_LAB_INVALID_EXTEN ${INVALID_EXTEN})
 same => n,Hangup()

; ---------------------------------------------------------------------------
; The lab "phone" (Asterisk -> LiveKit inbound trunk).
;
; scripts/e2e.mjs originates the inbound test leg over AMI with
;   Channel: PJSIP/600@agil-sip-out
;   Application: Playback / Data: hello-world
; which needs no dialplan. Extension 900 is the equivalent manual helper that
; also records the leg (useful when debugging by hand):
;   originate Local/900@lab-inbound extension 900
; ---------------------------------------------------------------------------
[lab-inbound]

exten => 900,1,NoOp(AGIL lab: Asterisk-originated inbound leg to LiveKit)
 same => n,Set(REC=/var/spool/asterisk/monitor)
 same => n,MixMonitor(${REC}/in-mix-${UNIQUEID}.wav,r(${REC}/in-rx-${UNIQUEID}.wav)t(${REC}/in-tx-${UNIQUEID}.wav))
 same => n,Verbose(1, AGIL_LAB_INBOUND_UP uniqueid=${UNIQUEID})
 same => n,Dial(PJSIP/600@agil-sip-out,40)
 same => n,Verbose(1, AGIL_LAB_INBOUND_DONE uniqueid=${UNIQUEID} status=${DIALSTATUS})
 same => n,Hangup()

exten => i,1,Verbose(1, AGIL_LAB_INVALID_EXTEN ${INVALID_EXTEN})
 same => n,Hangup()
