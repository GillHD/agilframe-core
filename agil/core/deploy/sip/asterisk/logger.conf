; AgilFrame — local SIP lab logging.
;
; `verbose` on the console is required: the dialplan prints AGIL_LAB_* markers
; that scripts/lab-up.sh and scripts/e2e.mjs grep to prove the call reached the
; expected extension. Files land in ./logs/asterisk (bind-mounted).

[general]
dateformat = %F %T

[logfiles]
console => notice,warning,error,verbose
messages => notice,warning,error,verbose
full => debug,verbose,notice,warning,error
security => security
