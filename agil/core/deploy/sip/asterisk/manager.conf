; AgilFrame ? local SIP lab AMI (Asterisk Manager Interface).
;
; Used by agil/core/deploy/sip/scripts/e2e.mjs to originate the inbound-test
; call ("the phone dials the app") and to read channel events. The socket is
; bound to loopback only.
;
; The user/password below are LAB VALUES, not secrets: they are committed on
; purpose so the lab script works with no extra setup, and the port is not
; reachable from the network. If the lab host is shared, change `secret` here
; and set ASTERISK_AMI_SECRET in .env (the script reads the env value).
;
; Do not reuse this file on a production Asterisk: AMI there must be bound to a
; management network, TLS-wrapped, and use per-integration accounts.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no
allowmultiplelogin = no

; The e2e script needs Originate (write=call) and channel/event reads.
; Asterisk 18+ also gates `Action: Originate` behind the *separate* `originate`
; privilege class (Asterisk 20 answers "Permission denied" without it), so keep
; it in both lists.
[agil]
secret = agil-lab-ami
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
permit = 127.0.0.1/255.255.255.0
