; AgilFrame — local SIP lab trunk (Asterisk 20, PJSIP, UDP only).
;
; Two logical peers on the same host:
;   * agil-livekit-*  — LiveKit SIP calls IN to Asterisk (app outbound call).
;                       Matched by source IP 127.0.0.1, no digest auth: a real
;                       carrier trunk must use TLS/IP allowlist/digest instead.
;   * agil-sip-out    — Asterisk calls LiveKit SIP (the lab "phone" dialing the
;                       app's inbound number 600). LiveKit SIP listens on 5070.
;
; No REGISTER anywhere: LiveKit SIP does not support SIP registration (docs),
; and the lab deliberately uses static peer/trunk configuration like a carrier
; SBC would.
;
; Media: G.711 only (ulaw/alaw), direct_media=no (media always through the
; server), rtp_symmetric=yes + rewrite_contact=yes so a peer behind a different
; interface still receives RTP.

[global]
type=global
endpoint_identifier_order=ip,username,anonymous
user_agent=AGIL-SIP-Lab

; `local_net` is a *transport* option (Asterisk 20 rejects it in [global]).
; Everything in this lab is loopback or the WSL2 host network; listing the
; private ranges keeps SDP addresses stable on multi-homed hosts.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes
local_net=127.0.0.0/8
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16

; ---------------------------------------------------------------------------
; LiveKit SIP -> Asterisk (outbound trunk of the app: called party)
; ---------------------------------------------------------------------------
[agil-livekit]
type=endpoint
transport=transport-udp
context=from-livekit
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
identify_by=ip
timers=no
ice_support=no
; A misconfigured/hung leg must not keep a channel forever in the lab.
rtp_timeout=120

[agil-livekit-identify]
type=identify
endpoint=agil-livekit
match=127.0.0.1/32

; ---------------------------------------------------------------------------
; Asterisk -> LiveKit SIP (inbound trunk of the app: the test softphone)
;
; Used only for outbound INVITEs in this lab (`PJSIP/<number>@agil-sip-out`).
; The context is the fallback landing place if LiveKit ever calls this peer
; back; the real inbound test goes through the `agil-livekit` identify rule.
; ---------------------------------------------------------------------------
[agil-sip-out]
type=endpoint
transport=transport-udp
context=lab-inbound
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=agil-sip-out-aor
timers=no
ice_support=no
rtp_timeout=120

[agil-sip-out-aor]
type=aor
contact=sip:127.0.0.1:5070
qualify_frequency=0
