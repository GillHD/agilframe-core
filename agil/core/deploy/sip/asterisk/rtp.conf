; AgilFrame — local SIP lab RTP settings (Asterisk 20).
;
; The media range is deliberately outside LiveKit's ranges so a packet capture
; or `docker compose exec` inspection cannot confuse the two legs:
;
;   16000-16100/udp   Asterisk RTP (this file)
;   10000-10100/udp   LiveKit SIP RTP (deploy/sip/livekit.yaml is the SFU config;
;                     the SIP worker's range lives in docker-compose.yml
;                     `SIP_CONFIG_BODY.rtp_port`)
;   50100-50200/udp   LiveKit WebRTC media (livekit.yaml)
;
; `strictrtp=no` is a lab trade-off: LiveKit SIP may re-use a source port for a
; different SSRC after a re-INVITE and strict RTP would drop the first packets.
; Do not copy this to a carrier-facing production Asterisk.

[general]
rtpstart=16000
rtpend=16100
; Symmetric RTP is negotiated per endpoint in pjsip.conf (rtp_symmetric=yes).
strictrtp=no
; No ICE/TURN: every peer is on the same host.
icesupport=no
; Keep RTCP on so Asterisk logs jitter/loss for the lab (`rtcp set debug`).
rtcpinterval=5000
